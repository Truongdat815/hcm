<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản trò — Đấu trí Hồ Chí Minh</title>
  <link rel="icon" type="image/svg+xml" href="/assets/camind_logo.svg">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&display=swap">
  <link rel="stylesheet" href="/css/quiz.css">
</head>
<body>
  <div class="overlay" id="gate">
    <form class="card gate" id="gate-form">
      <span class="logo">★</span>
      <h2>Bàn quản trò</h2>
      <input class="input" id="gate-pass" type="password" placeholder="Mật khẩu quản trò" autocomplete="current-password" autofocus>
      <button class="btn" type="submit">Vào phòng</button>
      <p class="err" id="gate-err" hidden></p>
    </form>
  </div>

  <header class="host-bar">
    <div class="brand"><span class="logo">★</span>ĐẤU TRÍ HỒ CHÍ MINH</div>
    <span class="pill"><span class="dot" id="dot"></span><span id="conn">Đang kết nối…</span></span>
    <a class="btn ghost" href="/">Về slide</a>
    <button class="btn ghost" id="btn-stop" type="button">Dừng trận</button>
    <button class="btn danger" id="btn-clear" type="button">Xóa phòng</button>
  </header>
  <main class="stage" id="stage"></main>

  <script src="/config.generated.js" onerror="this.onerror=null;this.src='/config.js';"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
  <script src="/js/firebase-game.js"></script>
  <script>
  (() => {
    const Q = window.HcmQuiz;
    const $ = id => document.getElementById(id);
    const esc = Q.escape;
    const SHAPES = ['▲', '◆', '●', '■'];
    const password = String(window.HCM_CONFIG?.ADMIN_PASSWORD || '2026');

    let state = null, players = {}, answers = {}, answersIndex = -1, answersRef = null;
    let questions = [], byId = new Map();
    let authed = false, loaded = { state: false, players: false }, revealing = false, shownKey = '';

    // ---------- Cổng mật khẩu ----------
    function unlock() {
      authed = true;
      $('gate').hidden = true;
      render();
    }
    $('gate-form').addEventListener('submit', event => {
      event.preventDefault();
      if ($('gate-pass').value.trim() === password) {
        sessionStorage.setItem('admin_pass', password);
        unlock();
      } else {
        $('gate-err').textContent = 'Mật khẩu không chính xác!';
        $('gate-err').hidden = false;
        $('gate-pass').value = '';
      }
    });
    if (sessionStorage.getItem('admin_pass') === password) { authed = true; $('gate').hidden = true; }

    if (!Q.db) {
      $('conn').textContent = 'Chưa kết nối';
      $('stage').innerHTML = `<div class="notice">${esc(Q.error)}</div>`;
      return;
    }
    Q.onConnection(online => {
      $('dot').classList.toggle('on', online);
      $('conn').textContent = online ? 'Đã kết nối' : 'Mất kết nối';
    });

    // ---------- Dữ liệu ----------
    Q.loadQuestions().then(list => {
      questions = list; byId = new Map(list.map(q => [q.id, q]));
      render();
    }).catch(() => { $('stage').innerHTML = '<div class="notice">Không tải được ngân hàng câu hỏi.</div>'; });

    Q.ref('state').on('value', snapshot => {
      state = Q.normalizeState(snapshot.val());
      loaded.state = true;
      watchAnswers();
      render();
    });
    Q.ref('players').on('value', snapshot => { players = snapshot.val() || {}; loaded.players = true; render(); });

    function watchAnswers() {
      const active = state && (state.status === 'QUESTION' || state.status === 'REVEAL') ? state.index : -1;
      if (active === answersIndex) return;
      if (answersRef) answersRef.off();
      answersRef = null; answers = {}; answersIndex = active;
      if (active >= 0) {
        answersRef = Q.ref(`answers/${active}`);
        answersRef.on('value', snapshot => { answers = snapshot.val() || {}; render(); });
      }
    }

    const board = () => Q.leaderboard(players);
    const answeredCount = () => board().filter(p => answers[p.id]).length;

    // ---------- Hành động quản trò ----------
    function questionPatch(index, order, secs) {
      const q = byId.get(order[index]);
      const now = Q.serverNow();
      return {
        status: 'QUESTION', order, index, total: order.length, secs,
        question: { text: q.text, options: q.options },
        startAt: now, endsAt: now + secs * 1000, reveal: null, revision: (state.revision || 0) + 1
      };
    }

    function start() {
      const ids = Object.keys(players).filter(id => players[id]?.name);
      if (!ids.length || !questions.length) return;
      const count = Math.min(Number($('qcount').value) || Q.settings.questionCount, questions.length);
      const order = Q.shuffle(questions.map(q => q.id)).slice(0, count);
      const updates = { answers: null, state: questionPatch(0, order, Q.settings.questionSeconds) };
      ids.forEach(id => { updates[`players/${id}/score`] = 0; updates[`players/${id}/last`] = null; });
      Q.ref('').update(updates);
    }

    function next() {
      if (state.status !== 'REVEAL') return;
      const nextIndex = state.index + 1;
      if (nextIndex >= state.order.length) {
        Q.ref('state').update({ status: 'ENDED', revision: (state.revision || 0) + 1 });
      } else {
        Q.ref('').update({ [`answers/${nextIndex}`]: null, state: questionPatch(nextIndex, state.order, state.secs) });
      }
    }

    async function reveal() {
      if (revealing || !state || state.status !== 'QUESTION') return;
      revealing = true;
      try {
        const index = state.index;
        const q = byId.get(state.order[index]);
        const submitted = (await Q.ref(`answers/${index}`).once('value')).val() || {};
        const counts = q.options.map(() => 0);
        const updates = {};
        for (const [id, player] of Object.entries(players)) {
          if (!player?.name) continue;
          const a = submitted[id];
          const choice = a && Number.isInteger(a.choice) && a.choice >= 0 && a.choice < counts.length ? a.choice : -1;
          if (choice >= 0) counts[choice]++;
          const correct = choice === q.answer;
          const gain = correct ? Q.scoreFor((a.at || state.endsAt) - state.startAt, state.secs) : 0;
          updates[`players/${id}/score`] = (Number(player.score) || 0) + gain;
          updates[`players/${id}/last`] = { index, choice, correct, gain };
        }
        updates['state/status'] = 'REVEAL';
        updates['state/reveal'] = { correct: q.answer, explanation: q.explanation, counts };
        updates['state/revision'] = (state.revision || 0) + 1;
        await Q.ref('').update(updates);
      } finally { revealing = false; }
    }

    function resetScores() {
      const updates = { answers: null, state: { status: 'LOBBY', order: [], index: -1, total: 0, question: null, reveal: null, revision: (state.revision || 0) + 1 } };
      Object.keys(players).forEach(id => { updates[`players/${id}/score`] = 0; updates[`players/${id}/last`] = null; });
      return Q.ref('').update(updates);
    }
    $('btn-stop').addEventListener('click', () => {
      if (state?.status !== 'LOBBY' && confirm('Dừng trận và đưa mọi người về phòng chờ? Điểm sẽ được xóa.')) resetScores();
    });
    $('btn-clear').addEventListener('click', () => {
      if (confirm('Xóa toàn bộ phòng, gồm cả danh sách người chơi?')) Q.ref('').set(null);
    });

    // ---------- Giao diện ----------
    const optionsHtml = options => options.map((text, i) =>
      `<div class="opt o${i}"><span class="shape">${SHAPES[i]}</span><span class="txt">${esc(text)}</span><span class="cnt" hidden></span><span class="tick">✓</span></div>`).join('');

    const views = {
      LOBBY() {
        const url = `${location.origin}/play`;
        return `<section class="lobby">
          <div class="card lobby-join"><span class="eyebrow" style="color:var(--red)">Tham gia trò chơi</span>
            <h2>Quét mã bằng điện thoại</h2>
            <img class="qr" alt="Mã QR tham gia" src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&margin=0&data=${encodeURIComponent(url)}">
            <div class="link">${esc(url)}</div></div>
          <div class="lobby-main">
            <span class="eyebrow">Phòng chờ</span>
            <div class="count-row"><b id="pcount">0</b><span>người chơi đã vào</span></div>
            <div class="chips" id="chips"></div>
            <div class="startbar"><button class="btn big" id="start" type="button">▶ Bắt đầu</button>
              <label>Số câu hỏi <select id="qcount"></select></label></div>
          </div></section>`;
      },
      QUESTION() {
        return `<section class="qview">
          <div class="qtop"><span class="pill" id="qnum"></span><div class="timer" id="timer"><b></b></div>
            <span style="display:flex;gap:.7rem;align-items:center"><span class="pill" id="answered"></span><button class="btn ghost" id="skip" type="button">Hiện đáp án</button></span></div>
          <h2 class="qtext" id="qtext"></h2><div class="opts" id="opts"></div></section>`;
      },
      REVEAL() {
        return `<section class="qview reveal">
          <div class="qtop"><span class="pill" id="qnum"></span>
            <span style="display:flex;gap:.7rem;align-items:center"><span class="pill" id="answered"></span><button class="btn" id="next" type="button"></button></span></div>
          <h2 class="qtext" id="qtext"></h2><div class="opts" id="opts"></div>
          <div class="two-col"><div class="explain" id="explain"></div><ol class="board" id="board"></ol></div></section>`;
      },
      ENDED() {
        return `<section class="ended"><span class="eyebrow">Kết thúc trò chơi</span><h1>Kết quả chung cuộc</h1>
          <div class="podium" id="podium"></div><ol class="board" id="board"></ol>
          <button class="btn big" id="again" type="button">Về phòng chờ</button><div class="confetti" id="confetti"></div></section>`;
      }
    };

    const boardRows = (rows, max, withGain) => rows.map(p =>
      `<li style="--w:${max ? Math.round((p.score / max) * 100) : 0}%"><span class="rk">${p.rank}</span><span class="nm">${esc(p.name)}</span>${withGain && p.last?.gain ? `<span class="gain">+${p.last.gain}</span>` : ''}<span class="sc">${p.score}</span></li>`).join('');

    const updates = {
      LOBBY() {
        const rows = board();
        $('pcount').textContent = rows.length;
        $('chips').innerHTML = rows.length
          ? rows.map(p => `<span class="chip">${esc(p.name)}<button type="button" data-kick="${esc(p.id)}" title="Mời ra khỏi phòng">×</button></span>`).join('')
          : '<span class="notice">Chưa có ai. Hãy cho lớp quét mã QR.</span>';
        $('start').disabled = !rows.length || !questions.length;
      },
      QUESTION() {
        $('qnum').textContent = `Câu ${state.index + 1}/${state.order.length}`;
        $('qtext').textContent = state.question.text;
        $('answered').textContent = `Đã trả lời ${answeredCount()}/${board().length}`;
      },
      REVEAL() {
        const r = state.reveal;
        const rows = board();
        $('qnum').textContent = `Câu ${state.index + 1}/${state.order.length}`;
        $('qtext').textContent = state.question.text;
        $('answered').textContent = `Đã trả lời ${answeredCount()}/${rows.length}`;
        document.querySelectorAll('#opts .opt').forEach((el, i) => {
          el.classList.toggle('dim', i !== r.correct);
          el.classList.toggle('right', i === r.correct);
          const cnt = el.querySelector('.cnt'); cnt.hidden = false; cnt.textContent = r.counts[i] || 0;
        });
        $('explain').innerHTML = r.explanation ? `<b>Giải thích</b><br>${esc(r.explanation)}` : '';
        $('explain').hidden = !r.explanation;
        $('board').innerHTML = boardRows(rows.slice(0, 5), rows[0]?.score || 0, true);
        $('next').textContent = state.index + 1 >= state.order.length ? 'Xem kết quả ▶' : 'Câu tiếp theo ▶';
      },
      ENDED() {
        const rows = board();
        const medals = ['🥇', '🥈', '🥉'];
        const step = (p, cls) => p ? `<div class="step ${cls}"><span class="medal">${medals[p.rank - 1]}</span><span class="nm">${esc(p.name)}</span><span class="pt">${p.score} điểm</span></div>` : '';
        $('podium').innerHTML = step(rows[1], 'p2') + step(rows[0], 'p1') + step(rows[2], 'p3');
        $('board').innerHTML = boardRows(rows.slice(3, 10), rows[0]?.score || 0);
        const box = $('confetti');
        if (!box.childElementCount) {
          const colors = ['#f6c445', '#e0314b', '#1f6fd6', '#2a9d4a', '#fff'];
          box.innerHTML = Array.from({ length: 45 }, (_, i) =>
            `<i style="left:${Math.random() * 100}%;background:${colors[i % colors.length]};animation-duration:${3 + Math.random() * 3}s;animation-delay:${-Math.random() * 5}s"></i>`).join('');
        }
      }
    };

    function render() {
      if (!authed || !state || !loaded.players || !questions.length) return;
      const key = (state.status === 'QUESTION' || state.status === 'REVEAL') ? `${state.status}${state.index}` : state.status;
      if (key !== shownKey) {
        shownKey = key;
        $('stage').innerHTML = views[state.status]();
        if (state.status === 'LOBBY') {
          const total = questions.length;
          const sizes = [...new Set([5, 10, 15, 20, Math.min(Q.settings.questionCount, total), total].filter(n => n <= total))].sort((a, b) => a - b);
          $('qcount').innerHTML = sizes.map(n => `<option value="${n}">${n === total ? `Tất cả (${n})` : n}</option>`).join('');
          $('qcount').value = String(Math.min(Q.settings.questionCount, total));
          $('start').addEventListener('click', start);
        } else if (state.status === 'QUESTION' || state.status === 'REVEAL') {
          $('opts').innerHTML = optionsHtml(state.question.options);
          if (state.status === 'QUESTION') $('skip').addEventListener('click', reveal);
          else $('next').addEventListener('click', next);
        } else {
          $('again').addEventListener('click', resetScores);
        }
      }
      updates[state.status]();
    }

    $('stage').addEventListener('click', event => {
      const id = event.target.dataset?.kick;
      if (id && confirm(`Mời "${players[id]?.name || ''}" ra khỏi phòng?`)) Q.ref(`players/${id}`).remove();
    });

    // Tự động hiện đáp án khi hết giờ hoặc mọi người đã trả lời.
    setInterval(() => {
      if (!authed || !state || state.status !== 'QUESTION' || !loaded.players) return;
      const left = Math.max(0, state.endsAt - Q.serverNow());
      const timer = $('timer');
      if (timer) {
        const secs = Math.ceil(left / 1000);
        timer.firstElementChild.textContent = secs;
        timer.style.setProperty('--p', (left / (state.secs * 1000)) * 100);
        timer.classList.toggle('low', secs <= 5);
      }
      const total = board().length;
      if (left <= 0 || (total > 0 && answeredCount() >= total)) reveal();
    }, 200);
  })();
  </script>
</body>
</html>
