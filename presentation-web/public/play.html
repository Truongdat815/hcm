<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Đấu trí Hồ Chí Minh</title>
  <link rel="icon" type="image/svg+xml" href="/assets/camind_logo.svg">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&display=swap">
  <link rel="stylesheet" href="/css/quiz.css">
</head>
<body>
  <div class="play">
    <div class="play-top"><span class="pill" id="who">★ ĐẤU TRÍ HỒ CHÍ MINH</span><div class="timer sm" id="ptimer" hidden><b></b></div><span class="pill" id="score" hidden></span></div>
    <div class="play-body" id="body"></div>
  </div>

  <script src="/config.generated.js" onerror="this.onerror=null;this.src='/config.js';"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
  <script src="/js/firebase-game.js"></script>
  <script>
  (() => {
    const Q = window.HcmQuiz;
    const $ = id => document.getElementById(id);
    const esc = Q.escape;
    const SHAPES = ['▲', '◆', '●', '■'];
    const NAME_KEY = 'hcm_player_name';
    const me = Q.clientId;

    let state = null, players = {}, myAnswer = null, myAnswerLoaded = false, answerIndex = -1, answerRef = null;
    let loaded = { state: false, players: false }, shownKey = '', notice = '';

    if (!Q.db) { $('body').innerHTML = `<div class="notice">${esc(Q.error)}</div>`; return; }

    Q.ref('state').on('value', snapshot => { state = Q.normalizeState(snapshot.val()); loaded.state = true; watchAnswer(); render(); });
    Q.ref('players').on('value', snapshot => { players = snapshot.val() || {}; loaded.players = true; render(); });

    // Nhớ lựa chọn của chính mình để refresh vẫn khôi phục đúng màn hình.
    function watchAnswer() {
      const active = state && state.status === 'QUESTION' ? state.index : -1;
      if (active === answerIndex) return;
      if (answerRef) answerRef.off();
      answerRef = null; myAnswer = null; myAnswerLoaded = active < 0; answerIndex = active;
      if (active >= 0) {
        answerRef = Q.ref(`answers/${active}/${me}`);
        answerRef.on('value', snapshot => { myAnswer = snapshot.val(); myAnswerLoaded = true; render(); });
      }
    }

    function join(name) {
      name = name.trim().slice(0, 20);
      if (!name) return;
      sessionStorage.setItem(NAME_KEY, name);
      notice = '';
      Q.ref(`players/${me}`).transaction(current => current && current.name
        ? Object.assign({}, current, { name })
        : { name, score: 0, joinedAt: Date.now() });
    }

    function answer(choice) {
      if (!state || state.status !== 'QUESTION' || myAnswer) return;
      if (Q.serverNow() > state.endsAt + 1500) return;
      myAnswer = { choice };
      render();
      Q.ref(`answers/${state.index}/${me}`).transaction(current => current ? undefined : { choice, at: Q.serverNow() });
    }

    const views = {
      JOIN: () => `<div class="hello"><span class="logo">★</span><h1 style="font-size:2rem">Đấu trí<br>Hồ Chí Minh</h1><p style="opacity:.8">Nhập tên để tham gia</p></div>
        <form id="join" class="center" style="display:grid;gap:1rem">
          <input class="input" id="name" maxlength="20" placeholder="Tên của bạn" autocomplete="off" value="${esc(sessionStorage.getItem(NAME_KEY) || '')}">
          <button class="btn big" type="submit">Vào phòng</button></form>
        ${notice ? `<p class="notice center">${esc(notice)}</p>` : ''}`,
      LOBBY: () => `<div class="hello"><span class="logo">★</span><h1 style="font-size:2rem">Xin chào,<br>${esc(players[me]?.name || '')}!</h1>
        <p style="opacity:.8">Bạn đã vào phòng</p><div class="wait-dots"><i></i><i></i><i></i></div><p>Chờ quản trò bắt đầu…</p></div>`,
      QUESTION: () => `<div class="play-q" id="q"></div><div class="opts" id="opts"></div><p class="play-msg" id="msg"></p>`,
      REVEAL: () => `<div id="result"></div>`,
      ENDED: () => `<div id="final"></div>`
    };

    function rankInfo() {
      const rows = Q.leaderboard(players);
      return { rows, mine: rows.find(p => p.id === me) };
    }

    const updates = {
      QUESTION() {
        $('q').textContent = state.question.text;
        const answered = !!myAnswer;
        $('opts').innerHTML = state.question.options.map((text, i) =>
          `<button class="opt o${i} ${answered ? (myAnswer.choice === i ? 'chosen' : 'dim') : ''}" data-choice="${i}" ${answered ? 'disabled' : ''}>
            <span class="shape">${SHAPES[i]}</span><span class="txt">${esc(text)}</span></button>`).join('');
        $('msg').textContent = answered ? 'Đã gửi đáp án! Chờ các bạn khác…' : '';
      },
      REVEAL() {
        const { rows, mine } = rankInfo();
        const last = mine?.last && mine.last.index === state.index ? mine.last : null;
        const right = state.question.options[state.reveal.correct] || '';
        let cls = 'none', icon = '–', title = 'Bạn chưa trả lời câu này', gain = '';
        if (last) {
          if (last.correct) { cls = 'good'; icon = '✓'; title = 'Chính xác!'; gain = `<span class="gain">+${last.gain} điểm</span>`; }
          else { cls = 'bad'; icon = '✕'; title = last.choice < 0 ? 'Hết giờ!' : 'Chưa đúng'; }
        }
        $('result').innerHTML = `<div class="result ${cls}"><span class="icon">${icon}</span><div class="big">${title}</div>${gain}
          ${last?.correct ? '' : `<div class="right">Đáp án đúng: <b>${esc(right)}</b></div>`}</div>
          <div class="rankcard"><span><b>${mine?.rank || '-'}/${rows.length}</b><small>Xếp hạng</small></span><span><b>${mine?.score || 0}</b><small>Điểm</small></span></div>
          <p class="play-msg">Chờ quản trò chuyển câu tiếp theo…</p>`;
      },
      ENDED() {
        const { rows, mine } = rankInfo();
        const medal = ['🥇', '🥈', '🥉'][(mine?.rank || 9) - 1] || '🏁';
        $('final').innerHTML = `<div class="result none"><span class="icon" style="font-size:2.6rem">${medal}</span><div class="big">Hạng ${mine?.rank || '-'}/${rows.length}</div>
          <span class="gain">${mine?.score || 0} điểm</span></div>
          <ol class="board">${rows.slice(0, 3).map(p => `<li style="--w:${rows[0].score ? Math.round(p.score / rows[0].score * 100) : 0}%"><span class="rk">${p.rank}</span><span class="nm">${esc(p.name)}</span><span class="sc">${p.score}</span></li>`).join('')}</ol>`;
      }
    };

    function render() {
      if (!loaded.state || !loaded.players) return;
      const mine = players[me];
      const joined = !!(mine && mine.name);
      if (!joined && sessionStorage.getItem(NAME_KEY) && !notice && shownKey && shownKey !== 'JOIN') {
        notice = 'Phòng đã được quản trò làm mới. Hãy nhập tên để vào lại.';
      }
      $('who').textContent = joined ? mine.name : '★ ĐẤU TRÍ HỒ CHÍ MINH';
      $('score').hidden = !joined;
      $('score').textContent = `${Number(mine?.score) || 0} điểm`;
      const view = !joined ? 'JOIN' : state.status;
      if (view === 'QUESTION' && !myAnswerLoaded) return;
      const key = view === 'QUESTION' || view === 'REVEAL' ? `${view}${state.index}` : view;
      if (key !== shownKey) {
        shownKey = key;
        $('body').className = view === 'QUESTION' ? 'play-body q' : 'play-body';
        $('body').innerHTML = views[view]();
        if (view === 'JOIN') {
          $('join').addEventListener('submit', event => { event.preventDefault(); join($('name').value); });
        } else if (view === 'QUESTION') {
          $('opts').addEventListener('click', event => {
            const button = event.target.closest('[data-choice]');
            if (button) answer(Number(button.dataset.choice));
          });
        }
      }
      if (updates[view]) updates[view]();
      $('ptimer').hidden = view !== 'QUESTION';
    }

    setInterval(() => {
      if (!state || state.status !== 'QUESTION') return;
      const left = Math.max(0, state.endsAt - Q.serverNow());
      const secs = Math.ceil(left / 1000), timer = $('ptimer');
      timer.firstElementChild.textContent = secs;
      timer.style.setProperty('--p', (left / (state.secs * 1000)) * 100);
      timer.classList.toggle('low', secs <= 5);
      if (left <= 0 && !myAnswer && $('msg')) $('msg').textContent = 'Hết giờ! Chờ kết quả…';
    }, 200);
  })();
  </script>
</body>
</html>
